<script>
/* Opened from the Home Screen: behave like an app, so the page itself can't be pinched or double-tapped bigger.
   In a normal browser tab, zoom stays available. */
(function(){
  var app = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  if (!app) return;
  document.documentElement.classList.add("app");
  var v = document.querySelector('meta[name=viewport]');
  if (v) v.setAttribute("content", "width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover");
  ["gesturestart","gesturechange","gestureend"].forEach(function(t){ document.addEventListener(t, function(e){ e.preventDefault(); }, {passive:false}); });
  /* two-finger pinches anywhere except the map and the photo framer */
  document.addEventListener("touchmove", function(e){ if (e.touches.length > 1 && !(e.target.closest && e.target.closest("svg.world, .cropper"))) e.preventDefault(); }, {passive:false});
})();
</script>
<script>
/* Language: the saved choice, else the phone's own language if the app has it, else English.
   Chinese and Spanish text lives in /i18n/ and is only downloaded when chosen. */
(function(){
  var l = null; try { l = localStorage.getItem("opp-lang"); } catch(e) {}
  if (!l){ var n = String(navigator.language || "").toLowerCase(); l = n.indexOf("zh") === 0 ? "zh" : n.indexOf("es") === 0 ? "es" : "en"; }
  if (l !== "zh" && l !== "es") l = "en";
  document.documentElement.lang = l === "zh" ? "zh-Hans" : l;
  if (l !== "en") document.write('<script src="/i18n/' + l + '.js?v=10"><\/script>');
})();
</script>

<style>

/* Layout: one phone-width column, sticky app bar, fixed bottom tab bar; passport pages use ink "stamps" for dishes eaten */
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --fg:#17201B; --muted:#5B6862; --line:#D9E0DA;
  --accent:#3344C2; --accent-fg:#FFFFFF; --accent-soft:#E6E9F9;
  --stamp:#A8323F; --ok:#2C7549; --scrim:rgba(10,14,12,.45); --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 16px rgba(20,30,25,.06);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-sm:8px; --r-md:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1311; --surface:#181D1A; --fg:#E5EBE7; --muted:#97A39D; --line:#2A322E;
  --accent:#93A0FF; --accent-fg:#0D1233; --accent-soft:#232A4A;
  --stamp:#F08391; --ok:#6CCB94; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1311; --surface:#181D1A; --fg:#E5EBE7; --muted:#97A39D; --line:#2A322E;
  --accent:#93A0FF; --accent-fg:#0D1233; --accent-soft:#232A4A;
  --stamp:#F08391; --ok:#6CCB94; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
#app{max-width:560px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px;min-height:58px}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.wordmark .dot{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--stamp);display:grid;place-items:center}
.wordmark .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--stamp)}
.bar h1{font-size:19px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--accent-soft)}
.icon-btn svg{width:22px;height:22px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-inline:16px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:9px 10px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--accent)}
.tab.log span.plus{width:40px;height:30px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.tab.log span.plus svg{width:20px;height:20px}
.tab.log{color:var(--fg)}

/* generic */
.stack{display:flex;flex-direction:column;gap:16px}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-sm);padding:10px 12px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:8px}
.section-h h2{font-size:18px;font-weight:600}
.section-h span{font-size:13px;color:var(--muted)}
.label{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding-inline:16px;border-radius:999px;font-weight:600;font-size:14px;border:1.5px solid var(--line);background:var(--surface)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn svg{width:18px;height:18px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* avatar */
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:hsl(var(--h) 45% 42%)}
.av.lg{width:64px;height:64px;font-size:22px}

/* photo art */
.photo{position:relative;display:block;width:100%;overflow:hidden;background:var(--line)}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.art{width:100%;height:100%;display:grid;place-items:center;background:
  radial-gradient(circle at 30% 25%, hsl(var(--h) 70% 72% / .9), transparent 55%),
  radial-gradient(circle at 75% 80%, hsl(calc(var(--h) + 40) 60% 55% / .9), transparent 60%),
  hsl(var(--h) 45% 48%)}
.art .e{font-size:clamp(56px,18vw,96px);filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.tile .art .e{font-size:clamp(28px,9vw,44px)}
.sample-tag{position:absolute;left:8px;bottom:8px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.45);color:#fff;padding:2px 7px;border-radius:999px}
.tile .sample-tag{display:none}

/* post card */
.post{background:var(--surface);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow)}
.post-h{display:flex;align-items:center;gap:10px;padding:12px 8px 12px 12px}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.who-t{min-width:0}
.who-t b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-t small{color:var(--muted);font-size:12.5px}
.cstamp{font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--stamp);border:1.5px solid var(--stamp);border-radius:4px;padding:1px 6px;transform:rotate(-3deg);flex:none}
.post .photo{aspect-ratio:4/3}
.post-b{padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px}
.acts{display:flex;align-items:center;gap:4px;margin-left:-8px}
.act{display:inline-flex;align-items:center;gap:5px;height:36px;padding-inline:8px;border-radius:999px;font-weight:600;font-size:14px}
.act:hover{background:var(--accent-soft)}
.act svg{width:22px;height:22px}
.act.liked{color:var(--stamp)}
.act.liked svg path{fill:currentColor}
.act.saved{color:var(--accent)}
.act.saved svg path{fill:currentColor}
.acts .date{margin-left:auto;font-size:12.5px;color:var(--muted)}
.dish-link{font-weight:700;font-size:16px;color:var(--fg);text-decoration:none}
.dish-link:hover{text-decoration:underline}
.where{color:var(--muted);font-size:14px}
.cap{font-size:14.5px}
.vis{font-size:12px;color:var(--muted)}

/* suggested people */
.people{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.person{flex:none;width:150px;background:var(--surface);border-radius:var(--r-md);padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:var(--shadow)}
.person b{font-size:14px}
.person small{color:var(--muted);font-size:12px;line-height:1.35}
.person .btn{height:32px;font-size:13px;padding-inline:14px}

/* explore */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding-inline:14px;height:46px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--fg);outline:none;-webkit-appearance:none;appearance:none}
.search:focus-within{border-color:var(--accent)}
.btn.sm{height:32px;padding-inline:14px;font-size:13px;flex:none}
.c-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.c-card{background:var(--surface);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.c-card .flag{font-size:30px;line-height:1}
.c-card b{font-family:var(--f-display);font-weight:600;font-size:17px}
.meter{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:999px}
.c-card small{font-size:12.5px;color:var(--muted)}

/* dish rows */
.d-list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.d-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%}
.d-row:first-child{border-top:0}
.d-row .em{font-size:28px;width:40px;text-align:center;flex:none}
.d-row .t{flex:1;min-width:0}
.d-row .t b{display:block;font-size:15px}
.d-row .t small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.d-row .t .meta{font-size:12px;color:var(--muted);margin-top:2px}
.tick{flex:none;font-family:var(--f-mono);font-size:10.5px;font-weight:700;color:var(--stamp);border:1.5px solid var(--stamp);border-radius:50%;width:46px;height:46px;display:grid;place-items:center;transform:rotate(-10deg);text-align:center;line-height:1.1}
.todo{flex:none;font-size:12.5px;font-weight:600;color:var(--accent)}

/* hero */
.hero{display:flex;flex-direction:column;gap:10px}
.hero .flag{font-size:44px;line-height:1}
.hero h2{font-size:30px;font-weight:800;letter-spacing:-.02em}
.hero p{color:var(--muted)}
.dish-hero .photo{aspect-ratio:16/10;border-radius:var(--r-md)}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;border-radius:var(--r-md);overflow:hidden}
.tile{aspect-ratio:1;display:block;position:relative}
.tile .photo{height:100%}
.empty-state{background:var(--surface);border-radius:var(--r-md);padding:24px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* passport */
.p-head{display:flex;gap:14px;align-items:center}
.p-head h2{font-size:24px;font-weight:800}
.p-head small{color:var(--muted)}
.bio{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow)}
.stats div{padding:12px;text-align:center;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line)}
.badge.got{border-color:var(--ok);color:var(--ok)}
.badge.not{color:var(--muted);opacity:.75}
.visa{background:var(--surface);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;
  background-image:repeating-linear-gradient(135deg, transparent 0 14px, var(--accent-soft) 14px 15px)}
.visa-h{display:flex;align-items:center;gap:10px}
.visa-h .flag{font-size:24px}
.visa-h b{font-family:var(--f-display);font-weight:600;font-size:17px;flex:1}
.stamps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stamp{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;text-align:center;border-radius:50%;background:var(--surface)}
.stamp.sq{border-radius:12px}
.stamp .se{font-size:24px;line-height:1}
.stamp .sn{font-size:11px;font-weight:700;line-height:1.15;text-transform:uppercase;letter-spacing:.03em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.stamp .sd{font-family:var(--f-mono);font-size:9px;font-weight:700}
.stamp.tried{color:var(--stamp);border:2px solid var(--stamp);box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4.5px var(--stamp);transform:rotate(var(--r,0deg))}
.stamp.empty{color:var(--muted);border:1.5px dashed var(--line)}
.stamp.empty .se{opacity:.35;filter:grayscale(1)}
.board{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.b-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);width:100%}
.b-row:first-child{border-top:0}
.b-row .rk{font-family:var(--f-mono);font-weight:700;width:20px;color:var(--muted)}
.b-row .nm{flex:1;min-width:0;font-weight:600}
.b-row .sc{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.b-row.me{background:var(--accent-soft)}
.offlist{display:flex;flex-direction:column;gap:6px}

/* sheet */
#sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-h h2{font-size:20px;font-weight:700}
.menu{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.menu button{padding:14px 16px;border-top:1px solid var(--line);font-weight:600}
.menu button:first-child{border-top:0}
.menu button.danger{color:var(--stamp)}
.field{display:flex;flex-direction:column;gap:6px}
.field select,.field input[type=text],.field textarea{font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%}
.field textarea{resize:vertical;min-height:70px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:4/3;max-width:100%;border:2px dashed var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--muted);text-align:center;padding:16px;cursor:pointer;overflow:hidden;position:relative}
.drop:hover{border-color:var(--accent)}
.drop svg{width:34px;height:34px}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0}
.chip span{display:inline-flex;height:36px;align-items:center;padding-inline:14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;cursor:pointer}
.chip input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12.5px;color:var(--muted)}
.radios{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.radios label{display:flex;gap:10px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);cursor:pointer}
.radios label:first-child{border-top:0}
.radios input{accent-color:var(--accent);width:18px;height:18px}

/* country tabs + guides */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.seg button{height:38px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);text-align:center}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.guide,.pick{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px}
.g-top{display:flex;gap:12px;align-items:center}
.g-id{display:flex;flex-direction:column;gap:2px;min-width:0}
.g-id b{font-family:var(--f-display);font-size:19px;font-weight:600}
.g-id small{color:var(--muted);font-size:13px}
.verified{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--accent)}
.verified svg,.checks svg,.g-pill svg{width:14px;height:14px;flex:none}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.checks li{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ok);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.g-pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--accent)}
.habits{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.habit{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.habit:first-child{border-top:0}
.habit b{font-size:14.5px}
.habit p{font-size:14px;color:var(--muted)}
.pick-h{display:flex;align-items:center;gap:12px;width:100%}
.pick-h .em{font-size:30px;width:40px;text-align:center;flex:none}
.pick-h .t{min-width:0}
.pick-h b{display:block;font-family:var(--f-display);font-size:17px;font-weight:600}
.pick-h small{color:var(--muted);font-size:13px}
.must{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.must span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.locked{display:flex;align-items:center;gap:12px;width:100%;margin-top:6px;padding:12px;border-radius:var(--r-sm);border:1.5px dashed var(--accent);background:var(--accent-soft)}
.locked svg{width:22px;height:22px;color:var(--accent);flex:none}
.lk-t{flex:1;min-width:0}
.lk-t b{display:block;font-size:14px}
.lk-t small{color:var(--muted);font-size:12.5px}
.lk-p{font-weight:700;color:var(--accent);font-size:14px;flex:none}
.places{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.place{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:3px;background:var(--bg)}
.pl-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.place small{color:var(--muted);font-size:13px}
.place p{font-size:14px}
.unlock-cta{background:var(--accent);color:var(--accent-fg);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:8px}
.unlock-cta h3{font-size:19px;font-weight:700}
.unlock-cta p{font-size:14px;opacity:.92}
.unlock-cta .btn{background:var(--accent-fg);color:var(--accent);border-color:var(--accent-fg);align-self:flex-start;margin-top:4px}
.incl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.price{display:flex;align-items:baseline;gap:10px}
.price .mono{font-size:32px;font-weight:700}
.price small{color:var(--muted)}

.access{display:flex;align-items:center;flex-wrap:wrap;gap:12px;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:14px}
.access .t{flex:1;min-width:180px}
.access .t b{display:block;font-size:15px}
.access .t small{color:var(--muted);font-size:13px}
.ok-dot{width:34px;height:34px;border-radius:50%;background:var(--ok);color:var(--surface);display:grid;place-items:center;flex:none}
.ok-dot svg{width:18px;height:18px}
.strike{text-decoration:line-through;opacity:.65;font-weight:500}
.demo-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.demo-row button{font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:underline}

/* guide portal */
.zone{display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:2px solid var(--line)}
.zone h2{font-size:22px;font-weight:800}
.zone-tag{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1.5px solid var(--ok);color:var(--ok);background:var(--surface)}
.zone-tag.paid{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.zone-tag svg{width:14px;height:14px}
.p-card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.p-card.paid{border:1.5px solid var(--accent)}
.p-card h3{font-size:17px;font-weight:600}
.p-item{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.p-item-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.p-place{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:10px}
.p-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.link-del{font-size:12.5px;font-weight:600;color:var(--stamp)}
.g-video{display:block;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:var(--r-sm);background:#000;object-fit:contain}
.drop.video{aspect-ratio:16/9}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.prose{white-space:pre-line}
.p-bar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 16px;box-shadow:0 6px 20px rgba(0,0,0,.14)}
#p-status{flex:1;min-width:0;font-size:13.5px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.preview-bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;background:var(--accent-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;font-weight:600}
.preview-bar button{color:var(--accent);text-decoration:underline;font-weight:700}

.byline{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);align-self:flex-start}
.byline .av{width:20px;height:20px;font-size:8.5px}
.habit .byline{margin-top:4px}
.g-pill.muted{color:var(--muted);font-weight:600}
.shared .field{align-self:stretch}
.ro-row{display:flex;gap:10px;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
.ro-row .em{font-size:24px;width:32px;text-align:center;flex:none}
.ro-row .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.ro-row b{font-size:14.5px}
.credits{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.credit{display:inline-flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border:1px solid var(--line);border-radius:999px}
.credit .av{width:30px;height:30px;font-size:11px}
.credit b{display:block;font-size:13px;line-height:1.2}
.credit small{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
.shared{border:1px dashed var(--line);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--surface)}
.city-pick{display:flex;flex-direction:column;gap:8px}
.city-chips{display:flex;flex-wrap:wrap;gap:8px}
.cchip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface)}
.cchip b{font-size:14px}
.cchip small{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.cchip small svg{width:12px;height:12px}
.cchip.has small{color:var(--ok);font-weight:600}
.cchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

#toast{position:fixed;left:50%;bottom:calc(136px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);font-size:14px;font-weight:500;padding:11px 16px;border-radius:12px;max-width:min(520px, calc(100% - 32px));box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* friends version additions */
.av-img{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;display:block}
.av-img.lg{width:64px;height:64px}
.av-img.sm,.av.sm{width:22px;height:22px;font-size:9px}
.faces{display:inline-flex;align-items:center;margin-left:2px}
.faces > *{margin-left:-6px;border:2px solid var(--surface);box-sizing:content-box}
.faces > *:first-child{margin-left:0}
.wordmark small{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0}
.status{font-size:13px;border-radius:var(--r-sm);padding:10px 12px;background:var(--accent-soft);color:var(--fg)}
.status b{font-weight:700}
.srcs{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11.5px;color:var(--muted)}
.srcs a{font-family:var(--f-mono);font-weight:700;font-size:11px;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:0 5px;color:var(--accent)}
.srcs a:hover{border-color:var(--accent)}
.place .pl-h a{font-size:12.5px;font-weight:700;text-decoration:none;flex:none}
.place .addr{color:var(--muted);font-size:13px;user-select:text}
.rule{padding:12px 14px;border-top:1px solid var(--line);font-size:14.5px}
.rule:first-child{border-top:0}
.week{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.wk{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:baseline}
.wk:first-child{border-top:0}
.wk .dy{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--muted)}
.wk.today{background:var(--accent-soft)}
.wk.today .dy{color:var(--accent)}
.wk ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:14px;min-width:0}
.wk li small{color:var(--muted)}
.prov{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
ol.sources{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
ol.sources a{word-break:break-word}
.inline-form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.inline-form .field{flex:1;min-width:180px}
.pp{position:relative;display:block;flex:none;cursor:pointer;border-radius:50%}
.pp .cam{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;border:2px solid var(--bg)}
.pp .cam svg{width:14px;height:14px}
.pp:focus-within{outline:2px solid var(--accent);outline-offset:2px}
label.link{color:var(--accent);font-weight:600;cursor:pointer}
:root{--star:#B7791F}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --star:#F2B84B } }
:root[data-theme="dark"]{ --star:#F2B84B }
.rating{color:var(--star);letter-spacing:1px;font-size:15px}
.rating .off{color:var(--line)}
.dish-rating{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.dish-rating b{color:var(--fg);font-family:var(--f-mono)}
.rate-rows{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:6px 10px}
.rate-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px}
.rate-row .rl{font-size:14px;font-weight:600}
.rate-overall{font-size:13.5px;color:var(--muted)}
.rate-overall b{color:var(--fg);font-family:var(--f-mono)}
.rate-line{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.rate-line b{font-size:14px}
.rate-bd{font-size:12.5px;color:var(--muted);width:100%}
.rate-bd b{color:var(--fg);font-family:var(--f-mono);font-weight:700}
.stars-in{display:flex;align-items:center;gap:0;flex-wrap:nowrap}
.stars-in button{font-size:26px;line-height:1;width:36px;height:38px;color:var(--line);border-radius:8px}
.stars-in button.on{color:var(--star)}
.stars-in button:hover{background:var(--accent-soft)}
.stars-in .rate-word{margin-left:8px;font-size:13.5px;color:var(--muted);font-weight:600}
.cc{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:12px 12px 12px;display:flex;flex-direction:column;gap:10px}
.cc-h{display:flex;align-items:center;gap:10px;width:100%}
.cc-h .flag{font-size:26px;line-height:1;flex:none}
.cc-h .t{flex:1;min-width:0;display:flex;flex-direction:column}
.cc-h b{font-family:var(--f-display);font-weight:600;font-size:16px}
.cc-h small{color:var(--muted);font-size:12.5px}
.cc-h .chev{font-size:22px;color:var(--muted);flex:none}
.cc-done{color:var(--ok);font-weight:700}
.meter.done i{background:var(--ok)}
.meter i{background:var(--accent)}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.strip::-webkit-scrollbar{display:none}
.sthumb{flex:none;width:76px;height:76px;border-radius:10px;overflow:hidden;position:relative}
.sthumb .photo{height:100%}
.off-tag{position:absolute;left:4px;bottom:4px;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(0,0,0,.55);color:#fff;border-radius:4px;padding:1px 4px}
.cropper{position:relative;border-radius:var(--r-md);overflow:hidden;background:var(--line);aspect-ratio:4/3;max-width:100%}
.cropper canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.cropper canvas:active{cursor:grabbing}
.crop-hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:11.5px;font-weight:600;background:rgba(0,0,0,.5);color:#fff;border-radius:999px;padding:3px 10px;white-space:nowrap;pointer-events:none}
.frame-pick{display:flex;gap:6px}
.cropper{margin-inline:auto;width:100%}
.crop-ctrl{display:flex;align-items:center;gap:10px}
.crop-ctrl input{flex:1;accent-color:var(--accent)}
.map-search{height:42px}
/* stamps */
.stamp{--ink:var(--stamp);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--ink)}
.stamp.travel{--ink:var(--accent)}.stamp.habit{--ink:#8A4FD8}.stamp.social{--ink:var(--ok)}
.st-ring{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;border:2.5px solid var(--ink);box-shadow:inset 0 0 0 4px var(--surface),inset 0 0 0 5.5px var(--ink);transform:rotate(var(--tilt));background:color-mix(in srgb,var(--ink) 8%,var(--surface))}
.st-ic{font-size:32px;line-height:1}
.stamp b{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.25;max-width:110px}
.stamp.locked{--ink:var(--muted)}
.stamp.locked .st-ring{border-style:dashed;box-shadow:none;background:transparent;opacity:.6}
.stamp.locked .st-ic{filter:grayscale(1);opacity:.35}
.stamp.mini .st-ring{width:44px;height:44px;border-width:2px;box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4px var(--ink)}
.stamp.mini .st-ic{font-size:19px}

function connect(){
  if (!sb){ mode = "setup"; render(); return; }
  sb.auth.onAuthStateChange((event, session) => {
    /* never await Supabase calls inside this callback; hand off instead */
    if (event === "PASSWORD_RECOVERY"){ setTimeout(() => { startSession(session); askNewPassword(); }, 0); return; }
    if (event === "INITIAL_SESSION" || event === "SIGNED_IN" || event === "SIGNED_OUT") setTimeout(() => startSession(session), 0);
  });
}
let liveChannel = null, sessionFor = null, lastRowsJSON = "";
async function startSession(session){
  const uid = session && session.user ? session.user.id : null;
  if (uid && uid === sessionFor && mode === "shared") return;
  sessionFor = uid;
  if (liveChannel){ sb.removeChannel(liveChannel); liveChannel = null; }
  if (!uid){ clearCache(); OUTBOX_MEALS = []; me = null; myEmail = ""; MEALS = []; PEOPLE = {}; GROUPS = []; mode = "signedout"; authView = "signin"; authMsg = ""; stack = [{v:"feed"}]; render(); return; }
  me = uid; myEmail = (session.user.email || "").toLowerCase();
  await loadOutbox();   /* meals logged with no signal, still waiting to upload */
  /* this device's last copy of the group shows instantly; fresh data replaces it a moment later */
  const cached = loadCache(uid);
  if (cached && applyRows(cached)){ mode = "shared"; lastRowsJSON = JSON.stringify(cached); render(); } else { mode = "connecting"; render(); }
  const [mem] = await Promise.all([
    sb.from("group_members").select("group_id").eq("email", myEmail),
    sb.from("profiles").upsert({id:me}, {onConflict:"id", ignoreDuplicates:true})]);
  if (mem.error && (cached || isNetErr(mem.error))){
    if (!cached){ mode = "shared"; mergeOutbox(); render(); }
    toast(navigator.onLine === false ? "You're offline. Showing what's saved on this phone." : "Couldn't reach the server. Showing what's saved on this phone.");
    return;
  }
  if (mem.error || !(mem.data || []).length){ clearCache(); mode = "notmember"; render(); return; }
  await refresh(true);   /* stays on the loading screen until the first data has arrived */
  openMealFromLink(); initPush();
  liveChannel = sb.channel("group-live")
    .on("postgres_changes", {event:"*", schema:"public", table:"meals"}, scheduleRefresh)
    .on("postgres_changes", {event:"*", schema:"public", table:"likes"}, scheduleRefresh)
    .on("postgres_changes", {event:"*", schema:"public", table:"profiles"}, scheduleRefresh)
    .on("postgres_changes", {event:"*", schema:"public", table:"groups"}, scheduleRefresh)
    .on("postgres_changes", {event:"*", schema:"public", table:"group_members"}, scheduleRefresh)

let refreshT = null;
function scheduleRefresh(){ clearTimeout(refreshT); refreshT = setTimeout(refresh, 300); }
async function refresh(first){
  if (mode !== "shared" && !first) return;
  const [m, p, l, g, gm, rp] = await Promise.all([
    sb.from("meals").select("*").order("created_at", {ascending:false}).limit(3000),
    sb.from("profiles").select("*"),
    sb.from("likes").select("meal_id,user_id"),
    sb.from("groups").select("id,name,created_by,created_at"),
    sb.from("group_members").select("group_id,email,role,added_at"),
    sb.from("reports").select("id,reporter,target_user,meal_id,kind,reason,note,status,created_at")]);
  if (m.error || p.error){ if (first && mode === "connecting"){ mode = "shared"; render(); } toast("Couldn't load your group's meals. Check your connection and reload."); return; }
  const rows = {m:m.data, p:p.data, l:l.data || [], g:g.error ? null : g.data, gm:gm.error ? null : gm.data, r:rp && !rp.error ? rp.data || [] : []};
  const same = mode === "shared" && JSON.stringify(rows) === lastRowsJSON; lastRowsJSON = JSON.stringify(rows);

  MEALS = d.m.map(r => ({id:r.id, uid:r.user_id, dish:r.dish, custom:r.custom || "", country:r.country, date:r.date, place:r.place || "", caption:r.caption || "",

function uidsIn(gid){ const g = groupById(gid); return new Set(g ? g.members.map(x => uidByEmail(x.email)).filter(Boolean) : []); }
function inGroupSel(sel, uid){ return sel === "all" || uid === me || uidsIn(sel).has(uid); }
function inSel(uid){ return inGroupSel(groupSel, uid); }
function setBoardSel(v){ boardSel = v; try { localStorage.setItem("opp-board", v); } catch(e) {} }

/* ---------- Writes ---------- */
function writeFailed(e){
  console.error(e);
  const msg = (e && (e.message || e.error_description)) || "";
  if (/row-level security|permission|not allowed/i.test(msg)) toast("You don't have permission to do that.");
  else if (/exceeded|quota|too large|payload/i.test(msg)) toast("Storage is full or the photo is too big. Try a smaller photo.");
  else toast("That didn't save. Check your connection and try again.");
}
const newId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx".replace(/x/g, () => (Math.random() * 16 | 0).toString(16));
async function uploadPhoto(path, blob){
  const {error} = await sb.storage.from("photos").upload(path, blob, {contentType:"image/jpeg", cacheControl:"31536000", upsert:false});
  if (error) throw error;
  return path;
}
const removeFiles = paths => { const ps = paths.filter(Boolean); if (ps.length) sb.storage.from("photos").remove(ps).catch(() => {}); };
/* upload each photo (a small and a full-size copy); returns their paths in order, or removes what it uploaded and throws */
async function uploadPics(base, pics){
  const paths = [], files = [];
  try {
    for (let i = 0; i < pics.length; i++){
      const b = base + (i ? "-" + i : "");
      const thumb_path = await uploadPhoto(b + "-t.jpg", pics[i].thumb); files.push(thumb_path);
      const photo_path = pics[i].full ? await uploadPhoto(b + ".jpg", pics[i].full) : null; if (photo_path) files.push(photo_path);
      paths.push({photo_path, thumb_path});
    }
  } catch(e){ removeFiles(files); throw e; }
  return paths;
}
const photoCols = paths => ({photo_path:paths[0].photo_path, thumb_path:paths[0].thumb_path, extra_photos:paths.slice(1)});
async function addMeal(m, pics, wasNew){
  if (navigator.onLine === false) return queueMeal(m, pics, wasNew);   /* no signal: keep it on the phone */
  try {
    const id = newId(), base = me + "/" + id + "-" + Date.now().toString(36);
    const paths = await uploadPics(base, pics);
    const {error} = await sb.from("meals").insert(Object.assign({id, user_id:me, dish:m.dish, custom:m.custom, country:m.country, date:m.date, place:m.place, caption:m.caption,
      ratings:m.ratings, rating:m.rating, price:m.price, ratio:m.ratio}, photoCols(paths)));
    if (error){ removeFiles(paths.flatMap(p => [p.thumb_path, p.photo_path])); throw error; }
    m.id = id; await refresh(); return true;
  } catch(e){ if (isNetErr(e)) return queueMeal(m, pics, wasNew); writeFailed(e); return false; }
}
async function toggleLike(m){
  const on = !(m.likes && m.likes[me]);
  m.likes = Object.assign({}, m.likes, {[me]:on}); render();
  const q = on ? sb.from("likes").insert({meal_id:m.id, user_id:me}) : sb.from("likes").delete().eq("meal_id", m.id).eq("user_id", me);
  const {error} = await q; if (error) writeFailed(error); else if (on) announceLike(m);
  scheduleRefresh();
}
async function deleteMeal(m){
  const {error} = await sb.from("meals").delete().eq("id", m.id);
  if (error){ writeFailed(error); return; }
  removeFiles(mealFiles(m)); await refresh();
}
async function setPerson(patch){
  const row = {};

  if ("saved" in patch) row.saved = patch.saved;

async function setAvatar(blob){
  const old = PEOPLE[me] && PEOPLE[me].photo_path;
  try {
    const path = blob ? await uploadPhoto(me + "/avatar-" + Date.now().toString(36) + ".jpg", blob) : null;
    const {error} = await sb.from("profiles").update({photo_path:path}).eq("id", me);
    if (error) throw error;
    if (old) removeFiles([old]);
    await refresh(); return true;
  } catch(e){ writeFailed(e); return false; }
}

async function submitAuth(){
  const email = ($("#a-email").value || "").trim(), passEl = $("#a-pass"), pass = passEl ? passEl.value : "";
  if (!email){ authMsg = "Enter your email address."; render(); return; }
  authBusy = true; authMsg = ""; render(); $("#a-email").value = email;
  let res;
  if (authView === "forgot") res = await sb.auth.resetPasswordForEmail(email, {redirectTo:location.origin + location.pathname});
  else if (authView === "signup") res = await sb.auth.signUp({email, password:pass});
  else res = await sb.auth.signInWithPassword({email, password:pass});
  authBusy = false;
  const err = res.error;
  if (err){
    const m = err.message || "";
    authMsg = /Database error saving new user|not been added/i.test(m) ? "That email hasn't been added to a group yet. Ask a friend to add it to one of their groups."
      : /Invalid login credentials/i.test(m) ? "That email and password don't match."
      : /already registered/i.test(m) ? "There's already an account with that email. Sign in instead."
      : /Password should be/i.test(m) ? "Use a password of at least 8 characters."
      : /rate limit|too many/i.test(m) ? "Too many attempts. Wait a few minutes and try again."
      : m || "Something went wrong. Try again.";
  } else if (authView === "forgot") authMsg = "If that email is in the group, a reset link is on its way.";
  else if (authView === "signup" && !(res.data && res.data.session)) authMsg = "Check your email to confirm your account, then sign in.";
  render();
  const e2 = $("#a-email"); if (e2) e2.value = email;
}

/* Opening screen: stays up for a moment (and until fonts are in, so nothing reflows), then slides away
   to reveal the app, which has already been drawn underneath. */
/* the loading screen is always visible for at least SPLASH_SEEN ms once it has appeared */
const SPLASH_SEEN = 550, SPLASH_FONTS_MAX = 1600;
let splashGoing = false;
function splashOut(){
  const el = document.getElementById("splash");
  if (!el || splashGoing || mode === "connecting") return;
  splashGoing = true;
  /* wait for the font stylesheet to arrive and the three fonts actually used on the first screen to load */
  const cssIn = new Promise(r => { if (window.__fontsCss) r(); else document.addEventListener("opp-fonts-css", r, {once:true}); });
  const faces = () => document.fonts && document.fonts.load ? Promise.all(['800 20px "Bricolage Grotesque"', '400 15px Figtree', '600 15px Figtree', '700 12px "JetBrains Mono"'].map(f => document.fonts.load(f).catch(() => {}))) : null;
  const fonts = Promise.race([cssIn.then(faces), new Promise(r => setTimeout(r, SPLASH_FONTS_MAX))]);
  const minWait = new Promise(r => setTimeout(r, Math.max(0, (window.__splashAt || performance.now()) + SPLASH_SEEN - performance.now())));
  Promise.all([fonts, minWait]).then(() => requestAnimationFrame(() => {
    document.body.classList.add("app-in");
    el.classList.add("gone");
    const done = () => { el.remove(); document.body.classList.remove("app-in"); };
    el.addEventListener("transitionend", done, {once:true}); setTimeout(done, 900);
  }));
}


/* ---------- Offline logging ----------
   With no signal, a new meal (with its photos) is kept on the phone in an "outbox" and shown straight away
   marked "Waiting to upload". As soon as the phone is back online it uploads by itself. */
const OUTBOX_DB = "opp-outbox", OUTBOX_STORE = "meals";
let OUTBOX_MEALS = [], flushing = false, flushTimer = 0;
const isNetErr = e => { const msg = String((e && (e.message || e.error_description || e.details)) || e || ""); return e instanceof TypeError || /failed to fetch|load failed|networkerror|network request failed|network connection|internet connection|offline|timed? ?out/i.test(msg); };
function idb(){
  return new Promise((res, rej) => {
    if (!window.indexedDB){ rej(new Error("no IndexedDB")); return; }
    const r = indexedDB.open(OUTBOX_DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(OUTBOX_STORE, {keyPath:"id"});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function obRun(mode, fn){ const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(OUTBOX_STORE, mode), q = fn(tx.objectStore(OUTBOX_STORE)); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); }); }
const obAll = () => obRun("readonly", s => s.getAll()).then(r => r || []);
const obPut = item => obRun("readwrite", s => s.put(item));
const obDel = id => obRun("readwrite", s => s.delete(id));

/* what's waiting, as meals the rest of the app can show */
const outboxPics = it => it.pics && it.pics.length ? it.pics : [{thumb:it.thumb, full:it.full || null}];
function asPendingMeal(it){
  const old = OUTBOX_MEALS.find(x => x.id === it.id);
  const photos = old ? old.photos : outboxPics(it).map(p => ({thumb:URL.createObjectURL(p.thumb), photo:p.full ? URL.createObjectURL(p.full) : null}));
  return Object.assign({}, it.meal, {id:it.id, uid:it.uid, likes:{}, pending:true, photos, thumb:photos[0].thumb, photo:photos[0].photo});
}
async function loadOutbox(){
  try { OUTBOX_MEALS = (await obAll()).filter(it => it.uid === me).map(asPendingMeal); } catch(e) { OUTBOX_MEALS = []; }
  mergeOutbox();
}
function mergeOutbox(){
  const real = MEALS.filter(m => !m.pending), ids = new Set(real.map(m => m.id));
  MEALS = OUTBOX_MEALS.filter(m => !ids.has(m.id) && m.uid === me).concat(real);
}
async function queueMeal(m, pics, wasNew){
  const id = newId();
  const meal = {dish:m.dish, custom:m.custom, country:m.country, date:m.date, place:m.place, caption:m.caption, ratings:m.ratings, rating:m.rating, price:m.price, ratio:m.ratio, created:m.created};
  try { await obPut({id, uid:me, meal, pics, thumb:pics[0].thumb, full:pics[0].full || null, wasNew:!!wasNew, queuedAt:Date.now()}); }
  catch(e) { console.error(e); toast("Couldn't save the meal on this phone. Try again when you have signal."); return false; }
  m.id = id;
  OUTBOX_MEALS.unshift(asPendingMeal({id, uid:me, meal, pics}));
  mergeOutbox(); render(); scheduleFlush(30000);
  return "queued";
}
function scheduleFlush(ms){ clearTimeout(flushTimer); if (OUTBOX_MEALS.length) flushTimer = setTimeout(flushOutbox, ms); }
async function flushOutbox(){
  if (flushing || !sb || !me || mode !== "shared" || navigator.onLine === false) return;
  flushing = true;   /* claimed before any waiting, so two triggers at once can't both upload */
  let items; try { items = (await obAll()).filter(it => it.uid === me); } catch(e) { flushing = false; return; }
  if (!items.length){ flushing = false; return; }
  let sent = 0, stuck = false;
  try {
    for (const it of items.sort((a, b) => a.queuedAt - b.queuedAt)){
      try {
        const base = me + "/" + it.id + "-" + Date.now().toString(36);
        const paths = await uploadPics(base, outboxPics(it));
        const {error} = await sb.from("meals").insert(Object.assign({id:it.id, user_id:me}, {dish:it.meal.dish, custom:it.meal.custom, country:it.meal.country, date:it.meal.date,
          place:it.meal.place, caption:it.meal.caption, ratings:it.meal.ratings, rating:it.meal.rating, price:it.meal.price, ratio:it.meal.ratio}, photoCols(paths)));
        if (error && !/duplicate key|already exists/i.test(error.message || "")){ removeFiles(paths.flatMap(p => [p.thumb_path, p.photo_path])); throw error; }
        await obDel(it.id); sent++;
        const done = OUTBOX_MEALS.find(x => x.id === it.id);
        if (done){ try { (done.photos || []).forEach(p => { URL.revokeObjectURL(p.thumb); if (p.photo) URL.revokeObjectURL(p.photo); }); } catch(e) {} }
        OUTBOX_MEALS = OUTBOX_MEALS.filter(x => x.id !== it.id);
        if (typeof announceMeal === "function") announceMeal(Object.assign({}, it.meal, {id:it.id}), it.wasNew);
      } catch(e) {
        if (isNetErr(e)){ stuck = true; break; }           /* still no signal: try again later */
        console.error("saved meal failed to upload", e); stuck = true;
      }
    }
  } finally { flushing = false; }
  if (sent){ toast(sent === 1 ? "Your saved meal has uploaded." : sent + " saved meals have uploaded."); await refresh(); }
  if (stuck) scheduleFlush(45000);
}

/* ---------- Profile picture framing: a circle you drag, pinch or zoom, like framing a meal photo ---------- */
let AV = null;
async function openAvatarCrop(file){
  const {img} = await loadImg(file);
  AV = {img, z:1, cx:img.naturalWidth / 2, cy:img.naturalHeight / 2, busy:false};
  openSheet('<div class="sheet-h"><h2>Profile picture</h2><button class="icon-btn" data-act="close" aria-label="Close">'+I.close+'</button></div><div class="stack">'
    + '<div class="cropper av-crop"><canvas id="av-cv" aria-label="Photo preview. Drag to choose which part shows."></canvas><span class="av-ring" aria-hidden="true"></span><span class="crop-hint">Drag to position · pinch or slide to zoom</span></div>'
    + '<div class="crop-ctrl"><label class="label" for="av-z">Zoom</label><input id="av-z" type="range" min="1" max="4" step="0.01" value="1"></div>'
    + '<div class="row-btns"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="av-save" id="av-save">Save</button></div></div>');
  avSetup();
}
function avRect(){
  const W = AV.img.naturalWidth, H = AV.img.naturalHeight, c = Math.min(W, H) / AV.z;
  AV.cx = Math.min(W - c / 2, Math.max(c / 2, AV.cx)); AV.cy = Math.min(H - c / 2, Math.max(c / 2, AV.cy));
  return {x:AV.cx - c / 2, y:AV.cy - c / 2, w:c, h:c};
}
function avDraw(){
  const cv = $("#av-cv"); if (!cv || !AV) return;
  const r = avRect(), px = Math.round((cv.clientWidth || 300) * Math.min(2, window.devicePixelRatio || 1));
  if (cv.width !== px){ cv.width = cv.height = px; }
  cv.getContext("2d").drawImage(AV.img, r.x, r.y, r.w, r.h, 0, 0, px, px);
}
function avSetup(){
  const cv = $("#av-cv"); if (!cv) return;
  avDraw();
  const zoomBy = f => { AV.z = Math.min(4, Math.max(1, AV.z * f)); const zi = $("#av-z"); if (zi) zi.value = AV.z; avDraw(); };
  const pts = new Map();
  cv.addEventListener("pointerdown", e => { pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); try { cv.setPointerCapture(e.pointerId); } catch(err) {} });
  cv.addEventListener("pointermove", e => {
    const prev = pts.get(e.pointerId); if (!prev || !AV) return;
    const now = {x:e.clientX, y:e.clientY};
    if (pts.size >= 2){
      const other = Array.from(pts.entries()).find(([id]) => id !== e.pointerId)[1];
      const d0 = Math.hypot(prev.x - other.x, prev.y - other.y), d1 = Math.hypot(now.x - other.x, now.y - other.y);
      if (d0 > 0) zoomBy(Math.pow(d1 / d0, PINCH_GAIN));
    } else { const k = avRect().w / (cv.clientWidth || 1); AV.cx -= (now.x - prev.x) * k; AV.cy -= (now.y - prev.y) * k; avDraw(); }
    pts.set(e.pointerId, now);
  });
  ["pointerup","pointercancel","lostpointercapture"].forEach(t => cv.addEventListener(t, e => pts.delete(e.pointerId)));
  cv.addEventListener("wheel", e => { e.preventDefault(); zoomBy(Math.exp(-e.deltaY * 0.0035)); }, {passive:false});
}
async function saveAvatarCrop(){
  if (!AV || AV.busy) return;

  const r = avRect(), cv = document.createElement("canvas"); cv.width = cv.height = 320;   /* re-encoding drops EXIF, including GPS */
  cv.getContext("2d").drawImage(AV.img, r.x, r.y, r.w, r.h, 0, 0, 320, 320);
  const blob = await new Promise(res => cv.toBlob(res, "image/jpeg", 0.86));
  const ok = await setAvatar(blob);
  if (ok){ AV = null; closeSheet(); toast("Profile picture updated."); }
  else { AV.busy = false; if (b){ b.disabled = false; b.textContent = "Save"; } }
}

async function squarePhoto(file){

  {src:"https://unpkg.com/jsvectormap@1.5.3/dist/maps/world.js", kind:"jvm"},
  {src:"https://cdn.jsdelivr.net/npm/@amcharts/amcharts4-geodata@4.1.28/dist/script/worldLow.js", kind:"geo"}];

function fromGeo(fc){

  const ring = r => "M" + r.map(pt).join("L") + "Z";

    const polys = g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
    return {id:String((f.properties && f.properties.id) || f.id || "").toUpperCase(), name:(f.properties && f.properties.name) || "", d:polys.map(p => p.map(ring).join("")).join("")}; }).filter(Boolean);

/* Replays someone's meals in date order, so each stamp knows when it was earned. */
function stampsFor(uid){
  const ms = mealsOf(uid).slice().sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.created || "").localeCompare(b.created || ""));
  const tried = {}, countries = new Set(), conts = new Set(), drinks = new Set(), same = {}, earned = {};

  const check = date => STAMPS.forEach(st => { if (!earned[st.id] && v[st.metric] !== undefined && v[st.metric] >= st.need) earned[st.id] = date || true; });
  ms.forEach((m, i) => {
    v.photos++;
    if (C[m.country]){ countries.add(m.country); conts.add(CONTINENT(m.country)); }
    v.countries = countries.size; v.continents = conts.size;
    if (m.dish && D[m.dish]){
      same[m.dish] = (same[m.dish] || 0) + 1; v.same = Math.max(v.same, same[m.dish]);
      if (!tried[m.dish]){ tried[m.dish] = true; v.dishes++; if (isDrink(m.dish)) drinks.add(m.dish); v.drinks = drinks.size;
        const c = C[D[m.dish].country]; if (c && c.dishes.every(d => tried[d.id])) v.complete++; }

  const zoomBy = f => { const p = curPic(); p.crop.z = Math.min(4, Math.max(1, p.crop.z * f)); const zi = $("#crop-z"); if (zi) zi.value = p.crop.z; drawCrop(); };
  const pts = new Map();
  cv.addEventListener("pointerdown", e => { pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); try { cv.setPointerCapture(e.pointerId); } catch(err) {} });

    const prev = pts.get(e.pointerId); if (!prev) return;

      const d0 = Math.hypot(prev.x - other.x, prev.y - other.y), d1 = Math.hypot(now.x - other.x, now.y - other.y);
      if (d0 > 0) zoomBy(Math.pow(d1 / d0, PINCH_GAIN));
    } else {
      const r = cropRect(), k = r.w / (cv.clientWidth || 1);
      const p = curPic(); p.crop.cx -= (now.x - prev.x) * k; p.crop.cy -= (now.y - prev.y) * k; drawCrop();
    }
    pts.set(e.pointerId, now);
  });
  ["pointerup","pointercancel","lostpointercapture"].forEach(t => cv.addEventListener(t, e => pts.delete(e.pointerId)));

}

let REPORTS = [], RP = null;

const REP_REASONS = [["explicit", "Nudity or sexual content"], ["offensive", "Offensive, hateful or violent"], ["spam", "Spam, or not food"], ["other", "Something else"]];

const PTR_GO = 62, PTR_MAX = 120, PTR_HOLD = 52;
let PTR = null, ptrBusy = false;
function ptrEl(){

    el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>';

function ptrCan(t){

    if (navigator.serviceWorker) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});

  if (e.touches.length === 1 && ptrCan(e.target)) PTR = {x0:e.touches[0].clientX, y0:e.touches[0].clientY, d:0, on:false};

  const dx = e.touches[0].clientX - PTR.x0, dy = e.touches[0].clientY - PTR.y0;

    case "mz": if (mapCtl) mapCtl.button(id); break;
    case "sign-out": closeSheet(); sb.auth.signOut(); break;
    case "settings": closeSheet(); if (cur().v !== "settings") go({v:"settings"}); break;
    case "set-pass": askNewPassword(); break;
    case "auth-view": authView = id; authMsg = ""; render(); break;
    case "save-nick1": { const v = ($("#nick1").value || "").trim().slice(0, 30); if (!v){ toast("Add a name first."); break; } closeSheet(); setPerson({nick:v}); toast("Welcome, " + v + "!"); break; }
    case "save-pass": { const v = ($("#newpass").value || ""); if (v.length < 8){ toast("Use at least 8 characters."); break; }
      sb.auth.updateUser({password:v}).then(({error}) => { if (error) toast("Couldn't change your password. Try again."); else { closeSheet(); toast("Password updated."); } }); break; }
    case "gsel": setGroupSel(id); render(); break;
    case "paste-photo": pastePhoto(); break;
    case "wrap": openWrap(t.dataset.uid || me); break;
    case "mem-role": { const [gid, email, role] = id.split("|"), g = groupById(gid) || {name:"the group"};
      if (role === "member"){ setRole(gid, email, role); break; }
      openSheet('<div class="stack"><h2 style="font-size:20px">Make '+esc(email)+' an admin of '+esc(g.name)+'?</h2><p class="hint">Admins can add and remove people, make other admins, rename the group and delete it.</p><div class="row-btns"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="mem-role-yes" data-id="'+esc(id)+'">Make admin</button></div></div>'); break; }
    case "mem-role-yes": { closeSheet(); const [gid, email, role] = id.split("|"); setRole(gid, email, role); break; }
    case "mem-add": addMember(id, ($("#mem-" + id) || {}).value); break;
    case "mem-del": { const [gid, email] = id.split("|"), g = groupById(gid) || {name:"the group"};
      openSheet('<div class="stack"><h2 style="font-size:20px">Remove '+esc(email)+' from '+esc(g.name)+'?</h2><p class="hint">If they aren\'t in any of your other groups, their meals disappear from your feed. Nothing is deleted, so adding them back brings everything back.</p><div class="row-btns"><button class="btn" data-act="close">Keep them</button><button class="btn primary" data-act="mem-del-yes" data-id="'+esc(id)+'" style="background:var(--stamp);border-color:var(--stamp)">Remove</button></div></div>'); break; }
    case "mem-del-yes": { closeSheet(); const [gid, email] = id.split("|"); removeMember(gid, email); break; }
    case "grp-new": createGroup(($("#new-group") || {}).value); break;
    case "grp-rename": { const g = groupById(id); if (!g) break;
      openSheet('<div class="stack"><h2 style="font-size:20px">Rename group</h2><div class="field"><label class="label" for="grp-name">Group name</label><input id="grp-name" type="text" maxlength="40" value="'+esc(g.name)+'"></div><button class="btn primary" data-act="grp-rename-save" data-id="'+esc(id)+'">Save</button></div>'); break; }
    case "grp-rename-save": { const v = ($("#grp-name") || {}).value; closeSheet(); renameGroup(id, v); break; }
    case "grp-del": { const g = groupById(id); if (!g) break;
      openSheet('<div class="stack"><h2 style="font-size:20px">Delete '+esc(g.name)+'?</h2><p class="hint">The group goes for everyone in it. Their accounts and meals stay, and anyone who shares another group with you still shows up.</p><div class="row-btns"><button class="btn" data-act="close">Keep it</button><button class="btn primary" data-act="grp-del-yes" data-id="'+esc(id)+'" style="background:var(--stamp);border-color:var(--stamp)">Delete group</button></div></div>'); break; }
    case "grp-del-yes": closeSheet(); deleteGroup(id); break;
    case "grp-leave": { const g = groupById(id); if (!g) break;
      openSheet('<div class="stack"><h2 style="font-size:20px">Leave '+esc(g.name)+'?</h2><p class="hint">'+(GROUPS.length === 1 ? 'This is your only group, so you won\'t be able to see anything until someone adds you to a group again.' : 'You\'ll stop seeing people you only share this group with.')+'</p><div class="row-btns"><button class="btn" data-act="close">Stay</button><button class="btn primary" data-act="grp-leave-yes" data-id="'+esc(id)+'" style="background:var(--stamp);border-color:var(--stamp)">Leave</button></div></div>'); break; }
    case "grp-leave-yes": closeSheet(); removeMember(id, myEmail); break;
    case "notif-on": enablePush(); break;
    case "notif-off": disablePush(); break;
    case "notif-pref": setNotifyPref(id, !!t.checked); break;
    case "mq-pick": pickOnMap(id); break;
    case "mq-clear": { e.preventDefault(); cur().mq = ""; const inp = $("#mq"); if (inp){ inp.value = ""; inp.blur(); }
      const box = $("#mq-sugg"); if (box){ box.hidden = true; box.innerHTML = ""; }
      if (mapCtl) mapCtl.button("reset"); else { mapHl = null; render(); } break; }
    case "cont": cur().cont = id; document.querySelectorAll(".fchip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === id))); renderExploreResults(); break;
    case "post": { const m = findMeal(id); if (m) openSheet(postCard(m)); break; }
    case "like": { const m = findMeal(id); if (m && canWrite()) toggleLike(m); break; }
    case "save": { if (!canWrite()) break; const s = savedOf(me).slice(), i = s.indexOf(id); if (i >= 0) s.splice(i,1); else s.push(id);
      setPerson({saved:s}); toast(i >= 0 ? "Removed from Want to try." : D[id].name + " saved to Want to try."); break; }
    case "pp-remove": setAvatar(null).then(ok => { if (ok) toast("Profile picture removed."); }); break;
    case "edit-nick": editingNick = true; render(); { const el = $("#nick"); if (el) el.focus(); } break;
    case "cancel-nick": editingNick = false; render(); break;
    case "edit-bio": editingBio = true; render(); { const el = $("#bio"); if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } } break;
    case "cancel-bio": editingBio = false; render(); break;
    case "save-bio": { const v = ($("#bio").value || "").replace(/\s+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim().slice(0, BIO_MAX), had = !!(PEOPLE[me] && PEOPLE[me].bio); editingBio = false; setPerson({bio:v}); toast(v ? "Bio saved." : had ? "Bio removed." : "No bio added."); break; }
    case "save-nick": { const v = ($("#nick").value || "").trim().slice(0,30); editingNick = false; setPerson({nick:v}); toast(v ? "Friends now see you as " + v + "." : "Friends now see your account name."); break; }
    case "menu": if (findMeal(id) && findMeal(id).uid !== me){ openSheet(otherMenuHTML(findMeal(id))); break; }
      openSheet('<div class="menu"><button data-act="edit-meal" data-id="'+esc(id)+'">Edit this meal</button><button class="danger" data-act="del-ask" data-id="'+esc(id)+'">Delete this meal</button><button data-act="close">Cancel</button></div>'); break;
    case "del-ask": openSheet('<div class="stack"><h2 style="font-size:20px">Delete this meal?</h2><p class="hint">It comes out of your passport and your friends\' feed. This can\'t be undone.</p><div class="row-btns"><button class="btn" data-act="close">Keep it</button><button class="btn primary" data-act="del" data-id="'+esc(id)+'" style="background:var(--stamp);border-color:var(--stamp)">Delete</button></div></div>'); break;
    case "del": { const m = findMeal(id); closeSheet(); if (m){ deleteMeal(m); toast("Meal deleted."); } break; }
    case "log": openComposer(id || (cur().v === "dish" ? cur().id : "")); break;
    case "pic-sel": if (K && K.pics[+id]){ K.sel = +id; renderComposer(); } break;
    case "pic-del": if (K && K.pics[+id]){ K.pics.splice(+id, 1); if (!K.pics.length && !K.editId) K.frame = null; K.sel = Math.min(K.sel, Math.max(0, K.pics.length - 1)); renderComposer(); } break;
    case "pic-cover": if (K && K.sel > 0){ const [p] = K.pics.splice(K.sel, 1); K.pics.unshift(p); K.sel = 0; renderComposer(); } break;
    case "car": { const tr = t.closest(".car") && t.closest(".car").querySelector(".car-track"); if (tr) tr.scrollBy({left:(+id) * tr.clientWidth, behavior:"smooth"}); break; }
    case "frame": if (K && K.pics.length){
        /* one shape for all photos; ones already posted are loaded again so they can be reframed */
        K.frame = id === "p" ? 3 / 4 : 4 / 3;
        const old = K.pics.filter(p => !p.src);
        K.pics.forEach(p => { if (p.src) p.crop = {z:1, cx:p.src.naturalWidth / 2, cy:p.src.naturalHeight / 2}; });
        if (old.length){ K.busy = true; Promise.all(old.map(loadExisting)).then(ok => { K.busy = false; if (ok.includes(false)) toast("That photo couldn't be loaded for repositioning."); renderComposer(); }); }
        renderComposer(); } break;
    case "crop-existing": { const p = curPic(); if (K && p && !p.src){ K.busy = true; loadExisting(p).then(ok => { K.busy = false; if (!ok) toast("That photo couldn't be loaded for repositioning."); renderComposer(); }); } break; }
    case "post-meal": if (K && !K.posting) postMeal(); break;
    case "edit-meal": openEditor(findMeal(id)); break;
    case "rate": if (K){ const [k, v] = id.split(":"), n = +v; K.ratings[k] = K.ratings[k] === n ? 0 : n; renderComposer(); } break;
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "c-file" && t.files && t.files.length){ const fs = Array.from(t.files); t.value = ""; await addFiles(fs); }
  else if (t.id === "pp-file" && t.files && t.files[0]){
    const f = t.files[0]; t.value = "";
    try { await openAvatarCrop(f); } catch(err){ photoError(err); }
  }
  else if (t.id === "c-country"){ K.country = t.value; K.dish = ""; if (!K.curManual) K.cur = CUR[K.country] || "EUR"; renderComposer(); }
  else if (t.id === "c-cur"){ K.cur = t.value; K.curManual = true; fxComposer(); }
  else if (t.id === "c-dish"){ K.dish = t.value; renderComposer(); }
  else if (t.id === "c-date"){ K.date = t.value; fxComposer(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q"){ cur().q = t.value; renderExploreResults(); }
  else if (t.id === "mq"){ cur().mq = t.value; renderMapSugg(t.value); }
  else if (!K) return;
  else if (t.id === "c-caption") K.caption = t.value;
  else if (t.id === "c-place") K.place = t.value;
  else if (t.id === "crop-z" && curPic() && curPic().src){ curPic().crop.z = +t.value; drawCrop(); }
  else if (t.id === "c-price"){ const had = hasPrice(); K.price = t.value; if (had !== hasPrice()){ renderComposer(); const el = $("#c-price"); if (el) el.focus(); } fxComposer(); }
  else if (t.id === "c-other"){ K.custom = t.value; $("#c-post").disabled = !(K.pics.length && K.country && K.custom.trim()); }
});
document.addEventListener("submit", e => { if (e.target && e.target.id === "auth-form"){ e.preventDefault(); if (!authBusy) submitAuth(); } });
document.addEventListener("keydown", e => {
  if (e.target && e.target.id === "mq"){
    if (e.key === "Enter"){ e.preventDefault(); const m = mapMatches(e.target.value)[0] || findOnMap(e.target.value, true);
      if (m) pickOnMap(m.id); else if (e.target.value.trim()) toast("No country on the map matches \"" + e.target.value.trim() + "\"."); }
    else if (e.key === "Escape"){ const box = $("#mq-sugg"); if (box) box.hidden = true; }
    else if (e.key === "ArrowDown"){ const f = document.querySelector("#mq-sugg button"); if (f){ e.preventDefault(); f.focus(); } }
  }
  else if (e.target && e.target.closest && e.target.closest("#mq-sugg") && (e.key === "ArrowDown" || e.key === "ArrowUp")){
    e.preventDefault(); const sib = e.key === "ArrowDown" ? e.target.nextElementSibling : e.target.previousElementSibling;
    if (sib && sib.tagName === "BUTTON") sib.focus(); else if (e.key === "ArrowUp") $("#mq").focus();
  } if (e.key === "Escape" && !$("#sheet-wrap").hidden) closeSheet(); });

document.addEventListener("scroll", e => {
  const tr = e.target; if (!tr || !tr.classList || !tr.classList.contains("car-track")) return;
  const car = tr.parentElement, n = tr.children.length, i = Math.max(0, Math.min(n - 1, Math.round(tr.scrollLeft / (tr.clientWidth || 1))));
  if (car._i === i) return; car._i = i;
  const b = car.querySelector(".car-n b"); if (b) b.textContent = i + 1;
  car.querySelectorAll(".car-dots i").forEach((d, k) => d.classList.toggle("on", k === i));
  const pv = car.querySelector(".car-arr.prev"), nx = car.querySelector(".car-arr.next"); if (pv) pv.hidden = i === 0; if (nx) nx.hidden = i === n - 1;
}, true);
const _renderProf = render;
render = function(){
  const keep = ["nick", "bio"].map(id => { const el = $("#" + id); return el && el.dataset.dirty ? {id, v:el.value, f:document.activeElement === el, s:el.selectionStart} : null; }).filter(Boolean);
  const r = _renderProf.apply(this, arguments);
  keep.forEach(k => { const el = $("#" + k.id); if (!el) return; el.value = k.v; el.dataset.dirty = "1"; if (k.f){ el.focus({preventScroll:true}); try { el.setSelectionRange(k.s, k.s); } catch(e) {} } });
  if (keep.length){ const n = $("#bio-n"), b = $("#bio"); if (n && b) n.textContent = b.value.length + "/" + BIO_MAX; }
  profDirty();
  return r;
};
const _renderFx = render;
render = function(){ const r = _renderFx.apply(this, arguments); fxFill(); return r; };
const _openSheetFx = openSheet;
openSheet = function(){ const r = _openSheetFx.apply(this, arguments); fxFill(); return r; };
const _renderCar = render;
render = function(){
  const pos = {}; document.querySelectorAll("#view .car-track[data-mid]").forEach(t => { if (t.scrollLeft) pos[t.dataset.mid] = t.scrollLeft; });
  const r = _renderCar.apply(this, arguments);
  Object.keys(pos).forEach(id => document.querySelectorAll("#view .car-track").forEach(t => { if (t.dataset.mid === id) t.scrollLeft = pos[id]; }));
  return r;
};
/* names in the chosen language, so lists, search and the share image use them */
(function localizeData(){
  if (!I18N) return;
  const x = I18N.extra || {};
  COUNTRIES.forEach(c => { c.en = c.name; c.name = T(c.name); });
  Object.values(D).forEach(d => { d.en = d.name; d.name = T(d.name); d.desc = T(d.desc); if (d.region) d.region = T(d.region); });
  COUNTRIES.sort((a, b) => a.name.localeCompare(b.name, LANG === "zh" ? "zh-Hans-u-co-pinyin" : LANG));
  STAMPS.forEach(st => { st.name = T(st.name); st.desc = T(st.desc); });
  if (x.months) WR_MONTHS.splice(0, 12, ...x.months);
  if (x.monthsMini) WR_MINI.splice(0, 12, ...x.monthsMini);
  /* the year-in-review share picture is drawn on a canvas, so its words go through the translator too */
  const P = CanvasRenderingContext2D.prototype, ft = P.fillText, mt = P.measureText;
  P.fillText = function(t, ...a){ return ft.call(this, T(String(t)), ...a); };
  P.measureText = function(t){ return mt.call(this, T(String(t))); };
})();
trWatch();
connect();
render();
})();
</script>
